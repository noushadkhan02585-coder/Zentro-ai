<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zentro-AI - Native Android Studio & APK Builder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased pb-12">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <i class="fa-solid fa-cube text-sky-400 text-xl"></i>
      <h1 class="text-lg font-bold text-sky-400 tracking-wide">Zentro-AI <span class="text-xs text-slate-400 font-normal">Native Studio</span></h1>
    </div>
    <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-2.5 py-1 rounded-full flex items-center gap-1.5 font-medium">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Cloud Builder Active
    </span>
  </header>

  <div class="max-w-7xl mx-auto p-4 grid grid-cols-1 lg:grid-cols-12 gap-6 mt-2">

    <!-- LEFT COLUMN: Configs, IDs & Native Project Ingestion -->
    <div class="lg:col-span-5 space-y-6">

      <!-- GitHub Token Configuration -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-lg">
        <h2 class="text-sm font-semibold text-sky-300 flex items-center gap-2 mb-3">
          <i class="fa-brands fa-github text-base"></i> GitHub Actions Token
        </h2>
        <div class="space-y-3">
          <div>
            <label class="block text-xs text-slate-400 mb-1">GitHub Personal Access Token (PAT)</label>
            <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxx" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-sky-500">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs text-slate-400 mb-1">Owner / Username</label>
              <input type="text" id="ghOwner" value="noushadkhan02585-coder" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-sky-500">
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Repository Name</label>
              <input type="text" id="ghRepo" value="Zentro-ai" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-sky-500">
            </div>
          </div>
        </div>
      </div>

      <!-- Real IDs Setup Panel -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-lg space-y-4">
        <h2 class="text-sm font-semibold text-sky-300 flex items-center gap-2">
          <i class="fa-solid fa-sliders text-base"></i> SDK क्रेडेंशियल्स व IDs
        </h2>

        <!-- Firebase Credentials -->
        <div class="p-3 bg-slate-950/80 rounded-lg border border-slate-800 space-y-2">
          <span class="text-xs font-semibold text-amber-400 flex items-center gap-1.5">
            <i class="fa-solid fa-fire"></i> Firebase Config (google-services.json)
          </span>
          <div class="grid grid-cols-2 gap-2">
            <input type="text" id="fbPkg" placeholder="Package (com.app.name)" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-white">
            <input type="text" id="fbProject" placeholder="Project ID" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-white">
          </div>
          <input type="text" id="fbApiKey" placeholder="API Key (AIzaSy...)" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-white">
          <input type="text" id="fbAppId" placeholder="App ID (1:12345:android:...)" class="w-full bg-slate-900 border border-slate
